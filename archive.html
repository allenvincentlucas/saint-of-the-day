<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Saint of the Day</title>
<meta name="description" content="Every saint added to the archive, grouped by feast day across the calendar year.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<meta property="og:title" content="Archive — Saint of the Day">
<meta property="og:description" content="Every saint added to the archive, grouped by feast day across the calendar year.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hub.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="masthead-kicker">Saint of the Day</p>
    <h1 class="masthead-title" style="font-size:clamp(32px,6vw,48px)">Archive</h1>
    <p class="masthead-sub">Every saint published so far, by feast day. Anything still scheduled for a future date stays hidden until it goes live.</p>
    <nav class="masthead-nav">
      <a href="index.html">Today</a>
      <a href="archive.html" aria-current="page">Full Archive</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <input
    type="search"
    class="archive-filter"
    id="archive-filter"
    placeholder="Filter by name or patronage&hellip;"
    aria-label="Filter saints by name or patronage">

  <div id="archive-grid">
    <p class="archive-empty">Loading archive&hellip;</p>
  </div>
</main>


<script src="assets/saint-of-the-day.js"></script>
<script>
  (async function () {
    const gridEl = document.getElementById("archive-grid");
    let allSaints = [];

    try {
      allSaints = await loadManifest();
      renderArchiveGrid(gridEl, allSaints);
    } catch (err) {
      gridEl.innerHTML = '<p class="archive-empty">Could not load the archive right now.</p>';
      console.error(err);
      return;
    }

    document.getElementById("archive-filter").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll(".archive-card").forEach(card => {
        const text = card.textContent.toLowerCase();
        card.hidden = q.length > 0 && !text.includes(q);
      });
      // hide empty month sections when filtering
      document.querySelectorAll(".archive-month").forEach(month => {
        const visible = [...month.querySelectorAll(".archive-card")].some(c => !c.hidden);
        month.style.display = visible ? "" : "none";
      });
    });
  })();
</script>

</body>
</html>
